<style>
  :root {
    --bg: #070E22;
    --face: #0A1330;
    --raised: #13204A;
    --stroke: #22305A;
    --edge: #040817;
    --text: #F1F5F9;
    --muted: #94A3B8;
    --accent: #38BDF8;
    --accent-2: #2D68F0;
    --ok: #34D399;
    --warn: #F87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rubik', system-ui, -apple-system, 'Segoe UI', 'Noto Sans', sans-serif;
    font-size: 15px;
  }
  .app { display: flex; height: 100vh; }

  /* ---------- Sidebar ---------- */
  aside {
    width: 270px;
    flex-shrink: 0;
    background: var(--face);
    border-right: 1px solid var(--stroke);
    display: flex; flex-direction: column;
  }
  .brand { padding: 20px 18px 12px; }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .search {
    margin: 4px 14px 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--stroke);
    background: var(--bg);
    color: var(--text);
    font: inherit; font-size: 14px;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  nav { overflow-y: auto; padding: 0 10px 16px; flex: 1; }
  nav button {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px;
    margin-bottom: 4px;
    border: 0; border-radius: 10px;
    background: transparent;
    color: var(--text);
    font: inherit; font-size: 14px; font-weight: 500;
    text-align: left; cursor: pointer;
  }
  nav button:hover { background: var(--raised); }
  nav button.active { background: var(--accent-2); box-shadow: 0 3px 0 #1E3F9E; }
  nav button .num { color: var(--muted); font-size: 12px; width: 22px; flex-shrink: 0; }
  nav button.active .num, nav button.active .code { color: #DCE7FF; }
  nav button .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav button .code { color: var(--muted); font-size: 12px; font-weight: 400; }

  /* ---------- Main ---------- */
  main { flex: 1; overflow-y: auto; padding: 28px 32px 48px; }
  .inner { max-width: 860px; margin: 0 auto; }
  .field {
    background: var(--face);
    border: 1px solid var(--stroke);
    border-radius: 16px;
    margin-bottom: 18px;
    box-shadow: 0 4px 0 var(--edge);
  }
  .field-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px 0;
  }
  .field-title { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
  .count { font-size: 12px; font-weight: 600; color: var(--ok); margin-left: 8px; letter-spacing: 0; }
  .count.over { color: var(--warn); }
  .value {
    margin: 0;
    padding: 12px 16px 16px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.55;
    font-size: 15px;
  }
  .value.big { font-size: 20px; font-weight: 600; }
  .copy {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px 9px;
    border: 0; border-radius: 10px;
    background: var(--accent-2);
    color: #fff;
    font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
    box-shadow: 0 3px 0 #1E3F9E;
  }
  .copy:hover { filter: brightness(1.1); }
  .copy:active { transform: translateY(2px); box-shadow: 0 1px 0 #1E3F9E; }
  .copy:focus-visible, nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy.done { background: #10B981; box-shadow: 0 3px 0 #047857; }
  .copy svg { width: 14px; height: 14px; }

  /* ---------- Phone ---------- */
  @media (max-width: 760px) {
    .app { flex-direction: column; height: auto; min-height: 100vh; }
    aside, main, nav { min-width: 0; max-width: 100%; }
    .value { overflow-wrap: anywhere; }
    aside { width: 100%; border-right: 0; border-bottom: 1px solid var(--stroke); }
    nav { display: flex; overflow-x: auto; overflow-y: hidden; gap: 6px; padding: 0 14px 12px; }
    nav button { width: auto; flex-shrink: 0; margin: 0; }
    nav button .num { display: none; }
    main { padding: 18px 16px 40px; overflow: visible; }
    .value.big { font-size: 18px; }
  }
</style>

const LANGS = [{"language": "English (US) – en-US", "label": "English (US)", "code": "en-US", "name": "Arrow Puzzle: Brain Game", "short": "Tap arrows to clear the board! 500 logic puzzles & daily brain challenges", "full": "Can you find the way out? Tap the arrows in the right order and clear the whole board!\n\nArrow Puzzle is a simple but addictive logic puzzle game. Every arrow slides in the direction it points – but only if its path is clear. Pick the wrong one and it gets blocked. Think ahead, plan your moves, and escape every arrow to win the level.\n\nEasy to learn, hard to master – the perfect brain game for a quick break or a long relaxing session.\n\n🏹 HOW TO PLAY\n• Tap an arrow to send it flying in its direction\n• An arrow can only escape if nothing is blocking its path\n• Clear every arrow from the board to complete the level\n• Avoid mistakes – you only have 3 hearts per level\n• Earn up to 3 stars for a perfect run\n\n🧠 500 HAND-CRAFTED LEVELS\nStart with relaxing warm-ups and work your way up to big, tricky master grids. Each level is a new brain teaser that trains your logic, focus and planning skills.\n\n💡 SMART BOOSTERS\nStuck on a tricky trap? Use a Hint to reveal the next safe arrow, or turn on the Grid to see every path clearly.\n\n🔥 DAILY CHALLENGES\nA fresh puzzle every day! Play the Daily Challenge, track your progress on the calendar and build your winning streak.\n\n💎 GEM TREASURY & FREE REWARDS\n• Claim a free daily gift\n• Complete daily tasks and milestones for bonus gems\n• Use gems for hints, grids and extra lives\n\n⭐ STARS & MILESTONES\nCollect stars on every level, double them with a bonus, and unlock milestone rewards as you progress.\n\n✨ WHY YOU'LL LOVE ARROW PUZZLE\n• Clean, modern dark design that is easy on the eyes\n• Smooth, satisfying arrow animations\n• No timer – play at your own pace\n• Short levels, great for a few minutes at a time\n• Free to play\n\nIf you enjoy logic puzzles, brain teasers, unblock puzzles, maze games or tap-away puzzle games, Arrow Puzzle is your next favorite.\n\nDownload now and see how many arrows you can escape!"}, {"language": "Portuguese (Brazil) – pt-BR", "label": "Portuguese (Brazil)", "code": "pt-BR", "name": "Arrow Puzzle: Quebra-Cabeça", "short": "Toque nas setas e limpe o tabuleiro! 500 fases de lógica e desafios diários", "full": "Você consegue encontrar a saída? Toque nas setas na ordem certa e limpe todo o tabuleiro!\n\nArrow Puzzle é um jogo de lógica simples, mas viciante. Cada seta desliza na direção para onde aponta, mas só se o caminho estiver livre. Escolha a errada e ela fica bloqueada. Pense à frente, planeje seus movimentos e faça todas as setas escaparem para vencer a fase.\n\nFácil de aprender, difícil de dominar: o jogo de raciocínio perfeito para uma pausa rápida ou uma longa sessão relaxante.\n\n🏹 COMO JOGAR\n• Toque em uma seta para lançá-la na direção dela\n• Uma seta só escapa se nada estiver bloqueando o caminho\n• Tire todas as setas do tabuleiro para completar a fase\n• Evite erros: você tem apenas 3 corações por fase\n• Ganhe até 3 estrelas com uma partida perfeita\n\n🧠 500 FASES FEITAS À MÃO\nComece com aquecimentos tranquilos e avance até tabuleiros grandes e desafiadores. Cada fase é um novo quebra-cabeça que treina sua lógica, foco e planejamento.\n\n💡 AJUDAS INTELIGENTES\nTravou numa armadilha difícil? Use uma Dica (Hint) para revelar a próxima seta segura ou ative a Grade (Grid) para ver cada caminho com clareza.\n\n🔥 DESAFIOS DIÁRIOS\nUm novo quebra-cabeça todo dia! Jogue o Desafio Diário, acompanhe seu progresso no calendário e aumente sua sequência de vitórias.\n\n💎 TESOURO DE GEMAS E RECOMPENSAS GRÁTIS\n• Resgate um presente diário grátis\n• Complete tarefas diárias e conquistas para ganhar gemas extras\n• Use gemas em dicas, grades e vidas extras\n\n⭐ ESTRELAS E CONQUISTAS\nColete estrelas em cada fase, dobre-as com um bônus e desbloqueie recompensas conforme avança.\n\n✨ POR QUE VOCÊ VAI AMAR O ARROW PUZZLE\n• Visual escuro, limpo e moderno, confortável para os olhos\n• Animações de setas suaves e satisfatórias\n• Sem cronômetro: jogue no seu ritmo\n• Fases curtas, perfeitas para poucos minutos livres\n• Grátis para jogar\n\nSe você curte jogos de lógica, desafios mentais, quebra-cabeças, jogos de desbloquear ou de labirinto, o Arrow Puzzle vai ser seu novo favorito.\n\nBaixe agora e veja quantas setas você consegue libertar!"}, {"language": "Spanish (Latin America) – es-419", "label": "Spanish (Latin America)", "code": "es-419", "name": "Arrow Puzzle: Juego de Lógica", "short": "¡Toca las flechas y despeja el tablero! 500 acertijos de lógica y retos diarios", "full": "¿Puedes encontrar la salida? ¡Toca las flechas en el orden correcto y despeja todo el tablero!\n\nArrow Puzzle es un juego de lógica sencillo pero adictivo. Cada flecha se desliza en la dirección que apunta, pero solo si su camino está libre. Si eliges la equivocada, se bloquea. Piensa con anticipación, planea tus movimientos y haz escapar cada flecha para ganar el nivel.\n\nFácil de aprender, difícil de dominar: el juego mental perfecto para un descanso rápido o una larga sesión relajante.\n\n🏹 CÓMO JUGAR\n• Toca una flecha para lanzarla en su dirección\n• Una flecha solo escapa si nada bloquea su camino\n• Despeja todas las flechas del tablero para completar el nivel\n• Evita errores: solo tienes 3 corazones por nivel\n• Gana hasta 3 estrellas con una partida perfecta\n\n🧠 500 NIVELES DISEÑADOS A MANO\nEmpieza con calentamientos relajantes y avanza hasta tableros grandes y complicados. Cada nivel es un nuevo acertijo que entrena tu lógica, concentración y planificación.\n\n💡 AYUDAS INTELIGENTES\n¿Atascado en una trampa difícil? Usa una Pista (Hint) para ver la siguiente flecha segura, o activa la Cuadrícula (Grid) para ver cada camino con claridad.\n\n🔥 RETOS DIARIOS\n¡Un nuevo rompecabezas cada día! Juega el Reto Diario, sigue tu progreso en el calendario y construye tu racha.\n\n💎 TESORO DE GEMAS Y RECOMPENSAS GRATIS\n• Reclama un regalo diario gratis\n• Completa tareas diarias y logros para ganar gemas extra\n• Usa gemas para pistas, cuadrículas y vidas extra\n\n⭐ ESTRELLAS Y LOGROS\nConsigue estrellas en cada nivel, duplícalas con un bono y desbloquea recompensas a medida que avanzas.\n\n✨ POR QUÉ TE ENCANTARÁ ARROW PUZZLE\n• Diseño oscuro, limpio y moderno, cómodo para la vista\n• Animaciones de flechas suaves y satisfactorias\n• Sin temporizador: juega a tu ritmo\n• Niveles cortos, ideales para unos minutos libres\n• Gratis para jugar\n\nSi te gustan los juegos de lógica, los acertijos, los rompecabezas, los juegos de desbloquear o de laberintos, Arrow Puzzle será tu nuevo favorito.\n\n¡Descárgalo ahora y descubre cuántas flechas puedes liberar!"}, {"language": "Hindi – hi-IN", "label": "Hindi", "code": "hi-IN", "name": "Arrow Puzzle: दिमागी पहेली", "short": "तीर पर टैप करें और बोर्ड साफ़ करें! 500 लॉजिक पहेलियाँ और रोज़ नई चुनौती", "full": "क्या आप रास्ता ढूंढ सकते हैं? सही क्रम में तीरों पर टैप करें और पूरा बोर्ड साफ़ करें!\n\nArrow Puzzle एक आसान लेकिन मज़ेदार लॉजिक पज़ल गेम है। हर तीर उसी दिशा में जाता है जिधर वह इशारा करता है – लेकिन तभी, जब उसका रास्ता खाली हो। गलत तीर चुना तो वह अटक जाएगा। आगे की सोचें, अपनी चालें प्लान करें और हर तीर को बाहर निकालकर लेवल जीतें।\n\nसीखना आसान, मास्टर बनना मुश्किल – छोटे ब्रेक या लंबे आरामदायक गेम के लिए एकदम सही दिमागी खेल।\n\n🏹 कैसे खेलें\n• तीर पर टैप करें और उसे उसकी दिशा में उड़ाएँ\n• तीर तभी बाहर निकलेगा जब उसके रास्ते में कुछ न हो\n• लेवल पूरा करने के लिए बोर्ड से सारे तीर हटाएँ\n• गलतियों से बचें – हर लेवल में सिर्फ़ 3 दिल मिलते हैं\n• परफ़ेक्ट खेल पर 3 स्टार तक कमाएँ\n\n🧠 500 खास तौर पर बनाए गए लेवल\nआसान वार्म-अप से शुरू करें और बड़े, मुश्किल मास्टर बोर्ड तक पहुँचें। हर लेवल एक नई दिमागी पहेली है जो आपकी लॉजिक, फ़ोकस और प्लानिंग को तेज़ करती है।\n\n💡 स्मार्ट मदद\nकिसी मुश्किल जगह पर अटक गए? Hint से अगला सुरक्षित तीर देखें, या Grid चालू करके हर रास्ता साफ़ देखें।\n\n🔥 डेली चैलेंज\nहर दिन एक नई पहेली! Daily Challenge खेलें, कैलेंडर पर अपनी प्रगति देखें और अपनी स्ट्रीक बढ़ाएँ।\n\n💎 जेम ट्रेज़री और फ्री इनाम\n• रोज़ का फ्री गिफ़्ट क्लेम करें\n• डेली टास्क और माइलस्टोन पूरे करके बोनस जेम पाएँ\n• जेम से Hint, Grid और एक्स्ट्रा लाइफ़ लें\n\n⭐ स्टार और माइलस्टोन\nहर लेवल पर स्टार जमा करें, बोनस से उन्हें डबल करें और आगे बढ़ते हुए माइलस्टोन इनाम अनलॉक करें।\n\n✨ आपको Arrow Puzzle क्यों पसंद आएगा\n• साफ़, मॉडर्न डार्क डिज़ाइन जो आँखों को आराम दे\n• स्मूथ और मज़ेदार तीर एनिमेशन\n• कोई टाइमर नहीं – अपनी रफ़्तार से खेलें\n• छोटे लेवल, कुछ मिनट के ब्रेक के लिए बढ़िया\n• खेलने के लिए फ्री\n\nअगर आपको लॉजिक पज़ल, दिमागी पहेलियाँ, ब्रेन टीज़र, अनब्लॉक पज़ल या भूलभुलैया वाले गेम पसंद हैं, तो Arrow Puzzle आपका नया फ़ेवरेट बनेगा।\n\nअभी डाउनलोड करें और देखें कि आप कितने तीर बाहर निकाल सकते हैं!"}, {"language": "Indonesian – id", "label": "Indonesian", "code": "id", "name": "Arrow Puzzle: Game Asah Otak", "short": "Ketuk panah & bersihkan papan! 500 teka-teki logika dan tantangan harian", "full": "Bisakah kamu menemukan jalan keluarnya? Ketuk panah dengan urutan yang benar dan bersihkan seluruh papan!\n\nArrow Puzzle adalah game logika yang sederhana tapi bikin ketagihan. Setiap panah meluncur ke arah yang ditunjuknya, tapi hanya jika jalurnya kosong. Salah pilih, panahnya akan terhalang. Pikirkan ke depan, rencanakan langkahmu, dan loloskan semua panah untuk memenangkan level.\n\nMudah dipelajari, sulit dikuasai – game asah otak yang pas untuk istirahat sebentar maupun bersantai lama.\n\n🏹 CARA BERMAIN\n• Ketuk panah untuk meluncurkannya sesuai arahnya\n• Panah hanya bisa lolos jika tidak ada yang menghalangi jalurnya\n• Bersihkan semua panah dari papan untuk menyelesaikan level\n• Hindari kesalahan – kamu hanya punya 3 nyawa per level\n• Raih hingga 3 bintang dengan permainan sempurna\n\n🧠 500 LEVEL BUATAN TANGAN\nMulai dari pemanasan santai hingga papan besar yang menantang. Setiap level adalah teka-teki baru yang melatih logika, fokus, dan kemampuan merencanakan.\n\n💡 BANTUAN PINTAR\nTerjebak di jebakan yang sulit? Gunakan Petunjuk (Hint) untuk melihat panah aman berikutnya, atau aktifkan Grid untuk melihat setiap jalur dengan jelas.\n\n🔥 TANTANGAN HARIAN\nTeka-teki baru setiap hari! Mainkan Tantangan Harian, pantau progres di kalender, dan bangun streak kemenanganmu.\n\n💎 HARTA PERMATA & HADIAH GRATIS\n• Klaim hadiah harian gratis\n• Selesaikan misi harian dan pencapaian untuk bonus permata\n• Gunakan permata untuk petunjuk, grid, dan nyawa tambahan\n\n⭐ BINTANG & PENCAPAIAN\nKumpulkan bintang di setiap level, gandakan dengan bonus, dan buka hadiah pencapaian seiring progresmu.\n\n✨ KENAPA KAMU AKAN SUKA ARROW PUZZLE\n• Desain gelap yang bersih dan modern, nyaman di mata\n• Animasi panah yang halus dan memuaskan\n• Tanpa batas waktu – main sesuai kecepatanmu\n• Level singkat, cocok untuk mengisi waktu luang\n• Gratis dimainkan\n\nKalau kamu suka game logika, teka-teki, asah otak, puzzle unblock, atau game labirin, Arrow Puzzle bakal jadi favorit barumu.\n\nUnduh sekarang dan lihat berapa banyak panah yang bisa kamu loloskan!"}, {"language": "Russian – ru-RU", "label": "Russian", "code": "ru-RU", "name": "Arrow Puzzle: Игра для ума", "short": "Нажимай на стрелки и очисти поле! 500 логических головоломок и задания дня", "full": "Сможешь найти выход? Нажимай на стрелки в правильном порядке и очисти всё поле!\n\nArrow Puzzle — простая, но затягивающая логическая головоломка. Каждая стрелка движется туда, куда указывает, но только если путь свободен. Выберешь не ту — она упрётся в препятствие. Думай наперёд, планируй ходы и выпусти все стрелки, чтобы пройти уровень.\n\nЛегко начать, сложно стать мастером — идеальная игра для ума на короткий перерыв или долгий спокойный вечер.\n\n🏹 КАК ИГРАТЬ\n• Нажми на стрелку, чтобы она улетела в своём направлении\n• Стрелка вылетит, только если на её пути ничего нет\n• Убери все стрелки с поля, чтобы пройти уровень\n• Избегай ошибок — на каждый уровень у тебя всего 3 сердца\n• Получи до 3 звёзд за идеальное прохождение\n\n🧠 500 УРОВНЕЙ, СОЗДАННЫХ ВРУЧНУЮ\nНачни с простых разминок и дойди до больших и хитрых полей. Каждый уровень — новая головоломка, которая тренирует логику, внимание и умение планировать.\n\n💡 УМНЫЕ ПОДСКАЗКИ\nЗастрял в хитрой ловушке? Используй подсказку (Hint), чтобы увидеть следующую безопасную стрелку, или включи сетку (Grid), чтобы ясно видеть каждый путь.\n\n🔥 ЕЖЕДНЕВНЫЕ ИСПЫТАНИЯ\nНовая головоломка каждый день! Проходи ежедневное испытание, следи за прогрессом в календаре и увеличивай свою серию побед.\n\n💎 СОКРОВИЩНИЦА КРИСТАЛЛОВ И БЕСПЛАТНЫЕ НАГРАДЫ\n• Забирай бесплатный ежедневный подарок\n• Выполняй ежедневные задания и достижения, чтобы получить бонусные кристаллы\n• Трать кристаллы на подсказки, сетку и дополнительные жизни\n\n⭐ ЗВЁЗДЫ И ДОСТИЖЕНИЯ\nСобирай звёзды на каждом уровне, удваивай их с бонусом и открывай награды за достижения по мере прохождения.\n\n✨ ПОЧЕМУ ТЕБЕ ПОНРАВИТСЯ ARROW PUZZLE\n• Чистый современный тёмный дизайн, комфортный для глаз\n• Плавные и приятные анимации стрелок\n• Без таймера — играй в своём темпе\n• Короткие уровни — отлично на пару свободных минут\n• Бесплатная игра\n\nЕсли тебе нравятся логические игры, головоломки, задачи на смекалку, игры-лабиринты или игры, где нужно убирать фигуры с поля, Arrow Puzzle станет твоей новой любимой игрой.\n\nСкачай сейчас и узнай, сколько стрелок ты сможешь выпустить!"}, {"language": "Turkish – tr-TR", "label": "Turkish", "code": "tr-TR", "name": "Arrow Puzzle: Zeka Oyunu", "short": "Oklara dokun, tahtayı temizle! 500 mantık bulmacası ve günlük zeka görevleri", "full": "Çıkış yolunu bulabilir misin? Oklara doğru sırayla dokun ve tüm tahtayı temizle!\n\nArrow Puzzle, basit ama bağımlılık yapan bir mantık bulmaca oyunudur. Her ok gösterdiği yöne kayar – ama yalnızca yolu boşsa. Yanlış oku seçersen takılır. Önceden düşün, hamlelerini planla ve bölümü kazanmak için tüm okları kurtar.\n\nÖğrenmesi kolay, ustalaşması zor – kısa bir mola ya da uzun ve rahatlatıcı bir oyun için mükemmel zeka oyunu.\n\n🏹 NASIL OYNANIR\n• Bir oka dokun, gösterdiği yöne uçsun\n• Ok yalnızca yolunda engel yoksa kaçabilir\n• Bölümü bitirmek için tahtadaki tüm okları temizle\n• Hatalardan kaçın – her bölümde sadece 3 canın var\n• Kusursuz bir oyunla 3 yıldıza kadar kazan\n\n🧠 ÖZENLE HAZIRLANMIŞ 500 BÖLÜM\nRahatlatıcı ısınma bölümleriyle başla, büyük ve zorlu usta tahtalarına kadar ilerle. Her bölüm mantığını, odağını ve planlama becerini geliştiren yeni bir bulmaca.\n\n💡 AKILLI YARDIMCILAR\nZor bir tuzağa mı takıldın? Sıradaki güvenli oku görmek için İpucu (Hint) kullan ya da her yolu net görmek için Izgarayı (Grid) aç.\n\n🔥 GÜNLÜK MEYDAN OKUMALAR\nHer gün yeni bir bulmaca! Günlük Meydan Okumayı oyna, ilerlemeni takvimde takip et ve galibiyet serini büyüt.\n\n💎 MÜCEVHER HAZİNESİ VE ÜCRETSİZ ÖDÜLLER\n• Ücretsiz günlük hediyeni al\n• Günlük görevleri ve kilometre taşlarını tamamlayarak bonus mücevher kazan\n• Mücevherleri ipucu, ızgara ve ekstra can için kullan\n\n⭐ YILDIZLAR VE KİLOMETRE TAŞLARI\nHer bölümde yıldız topla, bonusla ikiye katla ve ilerledikçe kilometre taşı ödüllerinin kilidini aç.\n\n✨ ARROW PUZZLE'I NEDEN SEVECEKSİN\n• Göz yormayan, sade ve modern koyu tasarım\n• Akıcı ve keyifli ok animasyonları\n• Süre sınırı yok – kendi hızında oyna\n• Kısa bölümler, birkaç dakikalık molalar için ideal\n• Ücretsiz oyna\n\nMantık oyunlarını, zeka bulmacalarını, blok çözme oyunlarını, labirent oyunlarını veya dokun-kaldır bulmacalarını seviyorsan, Arrow Puzzle yeni favorin olacak.\n\nHemen indir ve kaç oku kurtarabileceğini gör!"}, {"language": "Vietnamese – vi", "label": "Vietnamese", "code": "vi", "name": "Arrow Puzzle: Game Trí Tuệ", "short": "Chạm mũi tên để dọn sạch bàn cờ! 500 câu đố logic & thử thách trí tuệ mỗi ngày", "full": "Bạn có tìm được lối thoát? Chạm vào các mũi tên theo đúng thứ tự và dọn sạch cả bàn cờ!\n\nArrow Puzzle là game giải đố logic đơn giản nhưng gây nghiện. Mỗi mũi tên sẽ trượt theo hướng nó chỉ – nhưng chỉ khi đường đi trống. Chọn sai, nó sẽ bị chặn lại. Hãy suy nghĩ trước, lên kế hoạch từng bước và giải thoát mọi mũi tên để chiến thắng màn chơi.\n\nDễ học, khó thành thạo – game trí tuệ hoàn hảo cho một lúc nghỉ ngắn hay một buổi thư giãn dài.\n\n🏹 CÁCH CHƠI\n• Chạm vào mũi tên để nó bay theo hướng của mình\n• Mũi tên chỉ thoát ra được khi không có gì chắn đường\n• Dọn hết mũi tên trên bàn cờ để hoàn thành màn chơi\n• Tránh sai lầm – mỗi màn bạn chỉ có 3 trái tim\n• Đạt tới 3 sao khi chơi hoàn hảo\n\n🧠 500 MÀN CHƠI ĐƯỢC THIẾT KẾ TỈ MỈ\nBắt đầu với những màn khởi động nhẹ nhàng và tiến tới những bàn cờ lớn đầy thử thách. Mỗi màn là một câu đố mới giúp rèn luyện tư duy logic, sự tập trung và khả năng lập kế hoạch.\n\n💡 TRỢ GIÚP THÔNG MINH\nBị kẹt ở một cái bẫy khó? Dùng Gợi ý (Hint) để thấy mũi tên an toàn tiếp theo, hoặc bật Lưới (Grid) để nhìn rõ mọi đường đi.\n\n🔥 THỬ THÁCH HẰNG NGÀY\nCâu đố mới mỗi ngày! Chơi Thử thách hằng ngày, theo dõi tiến độ trên lịch và kéo dài chuỗi chiến thắng của bạn.\n\n💎 KHO ĐÁ QUÝ & PHẦN THƯỞNG MIỄN PHÍ\n• Nhận quà miễn phí mỗi ngày\n• Hoàn thành nhiệm vụ hằng ngày và cột mốc để nhận thêm đá quý\n• Dùng đá quý cho gợi ý, lưới và thêm mạng\n\n⭐ SAO & CỘT MỐC\nThu thập sao ở mỗi màn, nhân đôi bằng phần thưởng thêm và mở khóa quà cột mốc khi bạn tiến bộ.\n\n✨ VÌ SAO BẠN SẼ THÍCH ARROW PUZZLE\n• Thiết kế tối giản, hiện đại, dịu mắt\n• Hiệu ứng mũi tên mượt mà, đã mắt\n• Không giới hạn thời gian – chơi theo nhịp của bạn\n• Màn chơi ngắn, phù hợp cho vài phút rảnh rỗi\n• Miễn phí\n\nNếu bạn yêu thích game logic, câu đố trí tuệ, game giải phóng khối, mê cung hay game chạm để xóa, Arrow Puzzle sẽ là trò chơi yêu thích mới của bạn.\n\nTải ngay và xem bạn giải thoát được bao nhiêu mũi tên!"}, {"language": "Spanish (Spain) – es-ES", "label": "Spanish (Spain)", "code": "es-ES", "name": "Arrow Puzzle: Juego de Lógica", "short": "¡Toca las flechas y despeja el tablero! 500 puzles de lógica y retos diarios", "full": "¿Puedes encontrar la salida? ¡Toca las flechas en el orden correcto y despeja todo el tablero!\n\nArrow Puzzle es un juego de lógica sencillo pero adictivo. Cada flecha se desliza en la dirección a la que apunta, pero solo si su camino está libre. Si eliges la equivocada, se queda bloqueada. Piensa con antelación, planea tus movimientos y haz escapar cada flecha para superar el nivel.\n\nFácil de aprender, difícil de dominar: el juego mental perfecto para un descanso rápido o una larga partida relajante.\n\n🏹 CÓMO JUGAR\n• Toca una flecha para lanzarla en su dirección\n• Una flecha solo escapa si nada bloquea su camino\n• Quita todas las flechas del tablero para completar el nivel\n• Evita los errores: solo tienes 3 corazones por nivel\n• Consigue hasta 3 estrellas con una partida perfecta\n\n🧠 500 NIVELES DISEÑADOS A MANO\nEmpieza con calentamientos relajantes y avanza hasta tableros grandes y complicados. Cada nivel es un nuevo puzle que entrena tu lógica, tu concentración y tu capacidad de planificación.\n\n💡 AYUDAS INTELIGENTES\n¿Te has atascado en una trampa difícil? Usa una Pista (Hint) para ver la siguiente flecha segura, o activa la Cuadrícula (Grid) para ver cada camino con claridad.\n\n🔥 RETOS DIARIOS\n¡Un puzle nuevo cada día! Juega el Reto Diario, sigue tu progreso en el calendario y alarga tu racha de victorias.\n\n💎 TESORO DE GEMAS Y RECOMPENSAS GRATIS\n• Recoge un regalo diario gratis\n• Completa tareas diarias y logros para ganar gemas extra\n• Usa las gemas para pistas, cuadrículas y vidas extra\n\n⭐ ESTRELLAS Y LOGROS\nConsigue estrellas en cada nivel, duplícalas con un bonus y desbloquea recompensas a medida que avanzas.\n\n✨ POR QUÉ TE ENCANTARÁ ARROW PUZZLE\n• Diseño oscuro, limpio y moderno, cómodo para la vista\n• Animaciones de flechas suaves y satisfactorias\n• Sin cronómetro: juega a tu ritmo\n• Niveles cortos, ideales para unos minutos libres\n• Gratis para jugar\n\nSi te gustan los juegos de lógica, los puzles, los rompecabezas, los juegos de desbloquear o los laberintos, Arrow Puzzle será tu nuevo favorito.\n\n¡Descárgalo ya y descubre cuántas flechas puedes liberar!"}, {"language": "German – de-DE", "label": "German", "code": "de-DE", "name": "Arrow Puzzle: Denkspiel", "short": "Tippe auf Pfeile und leere das Brett! 500 Logikrätsel & tägliche Challenges", "full": "Findest du den Ausweg? Tippe die Pfeile in der richtigen Reihenfolge an und leere das ganze Spielfeld!\n\nArrow Puzzle ist ein einfaches, aber süchtig machendes Logikrätsel. Jeder Pfeil gleitet in die Richtung, in die er zeigt – aber nur, wenn sein Weg frei ist. Wählst du den falschen, bleibt er hängen. Denk voraus, plane deine Züge und befreie jeden Pfeil, um das Level zu schaffen.\n\nLeicht zu lernen, schwer zu meistern – das perfekte Denkspiel für eine kurze Pause oder eine lange, entspannte Runde.\n\n🏹 SO WIRD GESPIELT\n• Tippe auf einen Pfeil und er fliegt in seine Richtung\n• Ein Pfeil entkommt nur, wenn nichts seinen Weg blockiert\n• Räume alle Pfeile vom Spielfeld, um das Level abzuschließen\n• Vermeide Fehler – du hast nur 3 Herzen pro Level\n• Hol dir bis zu 3 Sterne für einen perfekten Lauf\n\n🧠 500 HANDGEMACHTE LEVEL\nStarte mit entspannten Aufwärmrunden und arbeite dich zu großen, kniffligen Meister-Feldern hoch. Jedes Level ist ein neues Rätsel, das Logik, Konzentration und Planung trainiert.\n\n💡 CLEVERE HILFEN\nSteckst du in einer kniffligen Falle fest? Nutze einen Tipp (Hint), um den nächsten sicheren Pfeil zu sehen, oder schalte das Raster (Grid) ein, um jeden Weg klar zu erkennen.\n\n🔥 TÄGLICHE CHALLENGES\nJeden Tag ein neues Rätsel! Spiele die Daily Challenge, verfolge deinen Fortschritt im Kalender und baue deine Siegesserie aus.\n\n💎 EDELSTEIN-SCHATZKAMMER & GRATIS-BELOHNUNGEN\n• Hol dir täglich ein Gratis-Geschenk\n• Erfülle tägliche Aufgaben und Meilensteine für Bonus-Edelsteine\n• Setze Edelsteine für Tipps, Raster und Extraleben ein\n\n⭐ STERNE & MEILENSTEINE\nSammle in jedem Level Sterne, verdopple sie mit einem Bonus und schalte Meilenstein-Belohnungen frei.\n\n✨ DARUM WIRST DU ARROW PUZZLE LIEBEN\n• Klares, modernes dunkles Design, angenehm für die Augen\n• Flüssige, befriedigende Pfeil-Animationen\n• Kein Timer – spiel in deinem eigenen Tempo\n• Kurze Level, ideal für ein paar Minuten zwischendurch\n• Kostenlos spielbar\n\nWenn du Logikspiele, Denksportaufgaben, Gehirnjogging, Unblock-Rätsel oder Labyrinth-Spiele magst, wird Arrow Puzzle dein neuer Favorit.\n\nJetzt herunterladen und herausfinden, wie viele Pfeile du befreien kannst!"}, {"language": "French – fr-FR", "label": "French", "code": "fr-FR", "name": "Arrow Puzzle: Jeu de Réflexion", "short": "Touchez les flèches et videz le plateau ! 500 puzzles logiques et défis du jour", "full": "Saurez-vous trouver la sortie ? Touchez les flèches dans le bon ordre et videz tout le plateau !\n\nArrow Puzzle est un jeu de logique simple mais addictif. Chaque flèche glisse dans la direction qu'elle indique – mais seulement si son chemin est libre. Choisissez la mauvaise, et elle se bloque. Anticipez, planifiez vos coups et libérez chaque flèche pour réussir le niveau.\n\nFacile à apprendre, difficile à maîtriser – le jeu de réflexion idéal pour une petite pause ou une longue session détente.\n\n🏹 COMMENT JOUER\n• Touchez une flèche pour l'envoyer dans sa direction\n• Une flèche ne peut s'échapper que si rien ne bloque son chemin\n• Retirez toutes les flèches du plateau pour terminer le niveau\n• Évitez les erreurs – vous n'avez que 3 cœurs par niveau\n• Gagnez jusqu'à 3 étoiles avec une partie parfaite\n\n🧠 500 NIVEAUX CONÇUS À LA MAIN\nCommencez par des échauffements relaxants et progressez jusqu'aux grandes grilles de maître, pleines de pièges. Chaque niveau est une nouvelle énigme qui entraîne votre logique, votre concentration et votre sens de l'anticipation.\n\n💡 AIDES MALIGNES\nBloqué sur un piège difficile ? Utilisez un Indice (Hint) pour révéler la prochaine flèche sûre, ou activez la Grille (Grid) pour voir clairement chaque chemin.\n\n🔥 DÉFIS QUOTIDIENS\nUne nouvelle énigme chaque jour ! Jouez au Défi du jour, suivez vos progrès sur le calendrier et allongez votre série de victoires.\n\n💎 TRÉSOR DE GEMMES & RÉCOMPENSES GRATUITES\n• Récupérez un cadeau gratuit chaque jour\n• Accomplissez des tâches quotidiennes et des paliers pour gagner des gemmes bonus\n• Utilisez vos gemmes pour des indices, des grilles et des vies supplémentaires\n\n⭐ ÉTOILES & PALIERS\nCollectionnez des étoiles à chaque niveau, doublez-les grâce à un bonus et débloquez des récompenses de palier au fil de votre progression.\n\n✨ POURQUOI VOUS ALLEZ ADORER ARROW PUZZLE\n• Design sombre, épuré et moderne, agréable pour les yeux\n• Animations de flèches fluides et satisfaisantes\n• Pas de chrono – jouez à votre rythme\n• Niveaux courts, parfaits pour quelques minutes de pause\n• Gratuit\n\nSi vous aimez les jeux de logique, les casse-têtes, les énigmes, les jeux de déblocage ou les labyrinthes, Arrow Puzzle sera votre nouveau favori.\n\nTéléchargez-le maintenant et voyez combien de flèches vous pouvez libérer !"}, {"language": "Arabic – ar", "label": "Arabic", "code": "ar", "name": "Arrow Puzzle: لعبة ذكاء", "short": "اضغط على الأسهم وأفرغ اللوحة! 500 لغز منطقي وتحديات يومية لعقلك", "full": "هل يمكنك إيجاد طريق الخروج؟ اضغط على الأسهم بالترتيب الصحيح وأفرغ اللوحة بالكامل!\n\nArrow Puzzle لعبة ألغاز منطقية بسيطة لكنها مسلية للغاية. يتحرك كل سهم في الاتجاه الذي يشير إليه – ولكن فقط إذا كان طريقه خاليًا. اختر السهم الخطأ وسيعلق. فكّر مسبقًا، خطّط لحركاتك، وحرّر كل الأسهم لتفوز بالمرحلة.\n\nسهلة التعلم وصعبة الإتقان – لعبة الذكاء المثالية لاستراحة قصيرة أو جلسة طويلة ممتعة.\n\n🏹 طريقة اللعب\n• اضغط على السهم ليطير في اتجاهه\n• لا يخرج السهم إلا إذا لم يعترض طريقه شيء\n• أزل كل الأسهم من اللوحة لإكمال المرحلة\n• تجنّب الأخطاء – لديك 3 قلوب فقط في كل مرحلة\n• احصل على ما يصل إلى 3 نجوم عند اللعب بدون أخطاء\n\n🧠 500 مرحلة مصممة بعناية\nابدأ بمراحل إحماء سهلة وتقدّم حتى الألواح الكبيرة والصعبة. كل مرحلة لغز جديد يدرّب منطقك وتركيزك ومهارة التخطيط لديك.\n\n💡 مساعدات ذكية\nعلقت في فخ صعب؟ استخدم التلميح (Hint) لكشف السهم الآمن التالي، أو فعّل الشبكة (Grid) لرؤية كل طريق بوضوح.\n\n🔥 تحديات يومية\nلغز جديد كل يوم! العب التحدي اليومي، وتابع تقدمك في التقويم، وحافظ على سلسلة انتصاراتك.\n\n💎 خزنة الجواهر ومكافآت مجانية\n• احصل على هدية يومية مجانية\n• أكمل المهام اليومية والإنجازات لتربح جواهر إضافية\n• استخدم الجواهر للتلميحات والشبكة والأرواح الإضافية\n\n⭐ النجوم والإنجازات\nاجمع النجوم في كل مرحلة، وضاعفها بمكافأة، وافتح جوائز الإنجازات كلما تقدمت.\n\n✨ لماذا ستحب Arrow Puzzle\n• تصميم داكن حديث وأنيق ومريح للعين\n• حركات أسهم سلسة وممتعة\n• بلا مؤقت – العب على راحتك\n• مراحل قصيرة، مثالية لبضع دقائق فراغ\n• مجانية اللعب\n\nإذا كنت تحب ألعاب المنطق، والألغاز، وألعاب الذكاء، وألعاب فك الحظر أو المتاهات، فستكون Arrow Puzzle لعبتك المفضلة الجديدة.\n\nحمّلها الآن واكتشف كم سهمًا يمكنك تحريره!"}, {"language": "Japanese – ja-JP", "label": "Japanese", "code": "ja-JP", "name": "Arrow Puzzle: 脳トレパズル", "short": "矢印をタップして盤面をクリア！500ステージの論理パズルと毎日のチャレンジで脳トレ", "full": "出口を見つけられますか？正しい順番で矢印をタップして、盤面をすべてクリアしよう！\n\nArrow Puzzle（アローパズル）は、シンプルなのにハマる論理パズルゲームです。矢印は指している方向へ進みます――ただし、進路が空いているときだけ。間違った矢印を選ぶと、途中で止まってしまいます。先を読み、手順を考えて、すべての矢印を脱出させればステージクリア！\n\nルールは簡単、でも極めるのは難しい。ちょっとした休憩にも、のんびり長く遊ぶのにもぴったりの脳トレゲームです。\n\n🏹 遊び方\n• 矢印をタップすると、その方向へ飛んでいきます\n• 進路に何もないときだけ、矢印は脱出できます\n• 盤面の矢印をすべて消すとステージクリア\n• ミスに注意――各ステージのハートは3つだけ\n• ノーミスでクリアすると最大3つ星を獲得\n\n🧠 手作りの500ステージ\nやさしいウォーミングアップから、大きくて手ごわい上級盤面まで。どのステージも、論理力・集中力・計画力を鍛える新しいパズルです。\n\n💡 便利なお助けアイテム\n難しいトラップで行き詰まったら？ヒント（Hint）で次に安全な矢印を表示したり、グリッド（Grid）をオンにしてすべての進路をはっきり確認できます。\n\n🔥 デイリーチャレンジ\n毎日新しいパズルが登場！デイリーチャレンジに挑戦して、カレンダーで進み具合をチェックし、連続記録を伸ばそう。\n\n💎 ジェムの宝物庫＆無料報酬\n• 毎日の無料プレゼントを受け取ろう\n• デイリータスクやマイルストーンを達成してボーナスジェムを獲得\n• ジェムはヒント、グリッド、追加ライフに使えます\n\n⭐ スター＆マイルストーン\n各ステージでスターを集め、ボーナスで2倍にして、進むごとにマイルストーン報酬を解放しよう。\n\n✨ Arrow Puzzle がおすすめの理由\n• 目にやさしい、シンプルでモダンなダークデザイン\n• なめらかで気持ちいい矢印アニメーション\n• 時間制限なし――自分のペースで遊べる\n• 1ステージが短く、すきま時間にぴったり\n• 基本プレイ無料\n\n論理パズル、脳トレ、謎解き、ブロック外しパズル、迷路ゲームが好きな人なら、Arrow Puzzle がきっと新しいお気に入りになります。\n\n今すぐダウンロードして、いくつの矢印を脱出させられるか挑戦しよう！"}, {"language": "Korean – ko-KR", "label": "Korean", "code": "ko-KR", "name": "Arrow Puzzle: 두뇌 퍼즐 게임", "short": "화살표를 탭해 보드를 비우세요! 500개 논리 퍼즐과 매일 새로운 두뇌 챌린지", "full": "출구를 찾을 수 있나요? 올바른 순서로 화살표를 탭해서 보드 전체를 비우세요!\n\nArrow Puzzle은 간단하지만 중독성 있는 논리 퍼즐 게임입니다. 모든 화살표는 가리키는 방향으로 날아가지만, 길이 비어 있을 때만 가능합니다. 잘못된 화살표를 고르면 막혀 버려요. 미리 생각하고, 수를 계획하고, 모든 화살표를 탈출시켜 레벨을 클리어하세요.\n\n배우기는 쉽고 마스터하기는 어려운, 짧은 휴식이나 긴 힐링 시간에 딱 맞는 두뇌 게임입니다.\n\n🏹 플레이 방법\n• 화살표를 탭하면 그 방향으로 날아갑니다\n• 길을 막는 것이 없을 때만 화살표가 탈출할 수 있어요\n• 보드의 모든 화살표를 없애면 레벨 클리어\n• 실수 주의 – 레벨마다 하트는 3개뿐\n• 완벽하게 클리어하면 최대 별 3개 획득\n\n🧠 직접 만든 500개 레벨\n편안한 워밍업부터 크고 까다로운 마스터 보드까지 차근차근 도전하세요. 모든 레벨이 논리력, 집중력, 계획력을 길러 주는 새로운 퍼즐입니다.\n\n💡 똑똑한 도우미\n까다로운 함정에 막혔나요? 힌트(Hint)로 다음 안전한 화살표를 확인하거나, 그리드(Grid)를 켜서 모든 길을 한눈에 보세요.\n\n🔥 데일리 챌린지\n매일 새로운 퍼즐! 데일리 챌린지를 플레이하고, 달력에서 진행 상황을 확인하며 연속 기록을 이어가세요.\n\n💎 보석 금고 & 무료 보상\n• 매일 무료 선물 받기\n• 일일 과제와 마일스톤을 완료하고 보너스 보석 획득\n• 보석으로 힌트, 그리드, 추가 목숨 사용\n\n⭐ 별 & 마일스톤\n레벨마다 별을 모으고, 보너스로 두 배로 늘리고, 진행할수록 마일스톤 보상을 열어 보세요.\n\n✨ Arrow Puzzle을 좋아하게 될 이유\n• 눈이 편한 깔끔하고 모던한 다크 디자인\n• 부드럽고 손맛 좋은 화살표 애니메이션\n• 시간 제한 없음 – 내 속도대로 플레이\n• 짧은 레벨, 자투리 시간에 딱\n• 무료 플레이\n\n논리 퍼즐, 두뇌 게임, 수수께끼, 블록 풀기 퍼즐, 미로 게임을 좋아한다면 Arrow Puzzle이 새로운 최애 게임이 될 거예요.\n\n지금 다운로드하고 몇 개의 화살표를 탈출시킬 수 있는지 도전해 보세요!"}, {"language": "Thai – th", "label": "Thai", "code": "th", "name": "Arrow Puzzle: เกมฝึกสมอง", "short": "แตะลูกศรเพื่อเคลียร์กระดาน! 500 ด่านปริศนาตรรกะ และชาเลนจ์ฝึกสมองทุกวัน", "full": "คุณหาทางออกเจอไหม? แตะลูกศรตามลำดับที่ถูกต้อง แล้วเคลียร์กระดานให้หมด!\n\nArrow Puzzle คือเกมปริศนาตรรกะที่เล่นง่ายแต่ติดงอมแงม ลูกศรแต่ละอันจะพุ่งไปตามทิศที่ชี้ – แต่ต้องมีทางว่างเท่านั้น ถ้าเลือกผิด ลูกศรจะติดค้าง คิดล่วงหน้า วางแผนการเดิน แล้วพาลูกศรทุกอันออกไปเพื่อผ่านด่าน\n\nเรียนรู้ง่าย แต่เก่งได้ยาก – เกมฝึกสมองที่เหมาะทั้งตอนพักสั้น ๆ และตอนอยากผ่อนคลายนาน ๆ\n\n🏹 วิธีเล่น\n• แตะลูกศรเพื่อให้พุ่งไปตามทิศของมัน\n• ลูกศรจะออกได้ก็ต่อเมื่อไม่มีอะไรขวางทาง\n• เคลียร์ลูกศรทั้งหมดบนกระดานเพื่อผ่านด่าน\n• ระวังพลาด – แต่ละด่านมีเพียง 3 หัวใจ\n• รับสูงสุด 3 ดาวเมื่อเล่นได้สมบูรณ์แบบ\n\n🧠 500 ด่านที่ออกแบบมาอย่างพิถีพิถัน\nเริ่มจากด่านวอร์มอัพสบาย ๆ ไปจนถึงกระดานใหญ่สุดหิน ทุกด่านคือปริศนาใหม่ที่ช่วยฝึกตรรกะ สมาธิ และการวางแผน\n\n💡 ตัวช่วยอัจฉริยะ\nติดกับดักยาก ๆ อยู่ใช่ไหม? ใช้คำใบ้ (Hint) เพื่อดูลูกศรที่ปลอดภัยอันถัดไป หรือเปิดตาราง (Grid) เพื่อเห็นทุกเส้นทางชัดเจน\n\n🔥 ชาเลนจ์ประจำวัน\nปริศนาใหม่ทุกวัน! เล่น Daily Challenge ติดตามความคืบหน้าบนปฏิทิน และสร้างสถิติชนะต่อเนื่องของคุณ\n\n💎 คลังอัญมณีและรางวัลฟรี\n• รับของขวัญฟรีทุกวัน\n• ทำภารกิจรายวันและเป้าหมายให้สำเร็จเพื่อรับอัญมณีโบนัส\n• ใช้อัญมณีแลกคำใบ้ ตาราง และชีวิตเพิ่ม\n\n⭐ ดาวและเป้าหมาย\nสะสมดาวในทุกด่าน เพิ่มเป็นสองเท่าด้วยโบนัส และปลดล็อกรางวัลเป้าหมายเมื่อคุณก้าวหน้า\n\n✨ ทำไมคุณจะหลงรัก Arrow Puzzle\n• ดีไซน์โทนมืด สะอาดตา ทันสมัย สบายตา\n• แอนิเมชันลูกศรลื่นไหล เล่นแล้วฟิน\n• ไม่มีจับเวลา – เล่นตามจังหวะของคุณ\n• ด่านสั้น เหมาะกับเวลาว่างไม่กี่นาที\n• เล่นฟรี\n\nถ้าคุณชอบเกมตรรกะ เกมปริศนา เกมฝึกสมอง เกมปลดล็อกบล็อก หรือเกมเขาวงกต Arrow Puzzle จะเป็นเกมโปรดเกมใหม่ของคุณ\n\nดาวน์โหลดเลย แล้วมาดูกันว่าคุณจะพาลูกศรออกไปได้กี่อัน!"}, {"language": "Filipino – fil", "label": "Filipino", "code": "fil", "name": "Arrow Puzzle: Brain Game", "short": "I-tap ang mga arrow at linisin ang board! 500 logic puzzle at daily challenge", "full": "Kaya mo bang hanapin ang daan palabas? I-tap ang mga arrow sa tamang pagkakasunod-sunod at linisin ang buong board!\n\nAng Arrow Puzzle ay simple pero nakaka-adik na logic puzzle game. Bawat arrow ay dumudulas sa direksyong itinuturo nito – pero kung malinis lang ang daan. Kapag mali ang napili mo, maiipit ito. Mag-isip nang maaga, planuhin ang bawat galaw, at palayain ang lahat ng arrow para manalo sa level.\n\nMadaling matutunan, mahirap i-master – ang perfect na brain game para sa mabilis na break o mahabang relaxing na laro.\n\n🏹 PAANO LARUIN\n• I-tap ang arrow para lumipad ito sa direksyon nito\n• Makakalabas lang ang arrow kung walang nakaharang sa daan\n• Alisin ang lahat ng arrow sa board para matapos ang level\n• Iwasan ang mali – 3 puso lang ang meron ka bawat level\n• Makakuha ng hanggang 3 bituin sa perfect na laro\n\n🧠 500 MAINGAT NA GINAWANG LEVEL\nMagsimula sa relaxing na warm-up at umakyat hanggang sa malalaki at mahihirap na master grid. Bawat level ay bagong brain teaser na nagsasanay sa iyong logic, focus at pagpaplano.\n\n💡 SMART NA TULONG\nNaipit sa mahirap na trap? Gumamit ng Hint para makita ang susunod na ligtas na arrow, o i-on ang Grid para makita nang malinaw ang bawat daan.\n\n🔥 DAILY CHALLENGES\nBagong puzzle araw-araw! Laruin ang Daily Challenge, i-track ang progress mo sa calendar at palakihin ang iyong winning streak.\n\n💎 GEM TREASURY AT LIBRENG REWARDS\n• I-claim ang libreng daily gift\n• Tapusin ang daily tasks at milestones para sa bonus gems\n• Gamitin ang gems para sa hints, grids at extra lives\n\n⭐ STARS AT MILESTONES\nMangolekta ng stars sa bawat level, i-double ito gamit ang bonus, at mag-unlock ng milestone rewards habang umuusad ka.\n\n✨ BAKIT MO MAGUGUSTUHAN ANG ARROW PUZZLE\n• Malinis at modern na dark design, magaan sa mata\n• Smooth at satisfying na arrow animations\n• Walang timer – maglaro sa sarili mong bilis\n• Maiikling level, swak sa ilang minutong pahinga\n• Libreng laruin\n\nKung mahilig ka sa logic puzzles, brain teasers, unblock puzzles, maze games o tap-away puzzle games, ang Arrow Puzzle ang magiging bago mong paborito.\n\nI-download na ngayon at tingnan kung ilang arrow ang kaya mong palayain!"}, {"language": "Italian – it-IT", "label": "Italian", "code": "it-IT", "name": "Arrow Puzzle: Gioco di Logica", "short": "Tocca le frecce e libera il tabellone! 500 puzzle di logica e sfide quotidiane", "full": "Riesci a trovare la via d'uscita? Tocca le frecce nell'ordine giusto e libera tutto il tabellone!\n\nArrow Puzzle è un gioco di logica semplice ma che crea dipendenza. Ogni freccia scorre nella direzione in cui punta, ma solo se la strada è libera. Scegli quella sbagliata e resta bloccata. Pensa in anticipo, pianifica le tue mosse e fai uscire ogni freccia per superare il livello.\n\nFacile da imparare, difficile da padroneggiare: il rompicapo perfetto per una pausa veloce o una lunga sessione rilassante.\n\n🏹 COME SI GIOCA\n• Tocca una freccia per farla volare nella sua direzione\n• Una freccia può uscire solo se niente blocca il suo percorso\n• Elimina tutte le frecce dal tabellone per completare il livello\n• Evita gli errori: hai solo 3 cuori per livello\n• Ottieni fino a 3 stelle con una partita perfetta\n\n🧠 500 LIVELLI CREATI A MANO\nInizia con riscaldamenti rilassanti e arriva fino a griglie grandi e insidiose. Ogni livello è un nuovo rompicapo che allena logica, concentrazione e capacità di pianificazione.\n\n💡 AIUTI INTELLIGENTI\nBloccato in una trappola difficile? Usa un Suggerimento (Hint) per scoprire la prossima freccia sicura, oppure attiva la Griglia (Grid) per vedere chiaramente ogni percorso.\n\n🔥 SFIDE QUOTIDIANE\nUn nuovo puzzle ogni giorno! Gioca la Sfida del giorno, segui i tuoi progressi sul calendario e allunga la tua serie di vittorie.\n\n💎 TESORO DI GEMME E RICOMPENSE GRATIS\n• Riscatta un regalo gratuito ogni giorno\n• Completa attività giornaliere e traguardi per ottenere gemme bonus\n• Usa le gemme per suggerimenti, griglie e vite extra\n\n⭐ STELLE E TRAGUARDI\nRaccogli stelle in ogni livello, raddoppiale con un bonus e sblocca le ricompense dei traguardi mentre avanzi.\n\n✨ PERCHÉ AMERAI ARROW PUZZLE\n• Design scuro, pulito e moderno, riposante per gli occhi\n• Animazioni delle frecce fluide e appaganti\n• Nessun timer: gioca con i tuoi tempi\n• Livelli brevi, perfetti per pochi minuti liberi\n• Gratis\n\nSe ti piacciono i giochi di logica, i rompicapi, gli indovinelli, i puzzle di sblocco o i labirinti, Arrow Puzzle sarà il tuo nuovo preferito.\n\nScaricalo ora e scopri quante frecce riesci a liberare!"}, {"language": "Polish – pl-PL", "label": "Polish", "code": "pl-PL", "name": "Arrow Puzzle: Gra Logiczna", "short": "Stukaj w strzałki i oczyść planszę! 500 łamigłówek i codzienne wyzwania", "full": "Czy znajdziesz wyjście? Stukaj w strzałki we właściwej kolejności i oczyść całą planszę!\n\nArrow Puzzle to prosta, ale wciągająca gra logiczna. Każda strzałka przesuwa się w kierunku, który wskazuje – ale tylko wtedy, gdy jej droga jest wolna. Wybierz złą, a utknie. Myśl z wyprzedzeniem, planuj ruchy i uwolnij każdą strzałkę, aby przejść poziom.\n\nŁatwa do nauczenia, trudna do opanowania – idealna gra na myślenie na krótką przerwę albo długi, relaksujący wieczór.\n\n🏹 JAK GRAĆ\n• Stuknij strzałkę, aby poleciała w swoim kierunku\n• Strzałka ucieknie tylko wtedy, gdy nic nie blokuje jej drogi\n• Usuń wszystkie strzałki z planszy, aby ukończyć poziom\n• Unikaj błędów – masz tylko 3 serca na poziom\n• Zdobądź do 3 gwiazdek za idealne przejście\n\n🧠 500 RĘCZNIE PRZYGOTOWANYCH POZIOMÓW\nZacznij od relaksującej rozgrzewki i dojdź do dużych, podchwytliwych plansz mistrzowskich. Każdy poziom to nowa łamigłówka, która ćwiczy logikę, skupienie i planowanie.\n\n💡 SPRYTNE POMOCE\nUtknąłeś w trudnej pułapce? Użyj podpowiedzi (Hint), aby zobaczyć następną bezpieczną strzałkę, albo włącz siatkę (Grid), aby wyraźnie widzieć każdą ścieżkę.\n\n🔥 CODZIENNE WYZWANIA\nNowa łamigłówka każdego dnia! Zagraj w Codzienne Wyzwanie, śledź postępy w kalendarzu i wydłużaj swoją serię zwycięstw.\n\n💎 SKARBIEC KLEJNOTÓW I DARMOWE NAGRODY\n• Odbierz darmowy codzienny prezent\n• Wykonuj codzienne zadania i kamienie milowe, aby zdobyć dodatkowe klejnoty\n• Wydawaj klejnoty na podpowiedzi, siatkę i dodatkowe życia\n\n⭐ GWIAZDKI I KAMIENIE MILOWE\nZbieraj gwiazdki na każdym poziomie, podwajaj je bonusem i odblokowuj nagrody za kamienie milowe.\n\n✨ DLACZEGO POKOCHASZ ARROW PUZZLE\n• Czysty, nowoczesny, ciemny wygląd przyjazny dla oczu\n• Płynne i satysfakcjonujące animacje strzałek\n• Bez limitu czasu – graj we własnym tempie\n• Krótkie poziomy, idealne na kilka wolnych minut\n• Darmowa gra\n\nJeśli lubisz gry logiczne, łamigłówki, zagadki, gry typu unblock albo labirynty, Arrow Puzzle stanie się Twoją nową ulubioną grą.\n\nPobierz teraz i sprawdź, ile strzałek uda Ci się uwolnić!"}, {"language": "Ukrainian – uk", "label": "Ukrainian", "code": "uk", "name": "Arrow Puzzle: Гра для розуму", "short": "Торкайся стрілок і очисти поле! 500 логічних головоломок і щоденні виклики", "full": "Зможеш знайти вихід? Торкайся стрілок у правильному порядку й очисти все поле!\n\nArrow Puzzle — проста, але захоплива логічна головоломка. Кожна стрілка рухається туди, куди вказує, але лише тоді, коли шлях вільний. Обереш не ту — вона застрягне. Думай наперед, плануй ходи й випусти всі стрілки, щоб пройти рівень.\n\nЛегко почати, складно стати майстром — ідеальна гра для розуму на коротку перерву чи довгий спокійний вечір.\n\n🏹 ЯК ГРАТИ\n• Торкнися стрілки, щоб вона полетіла у своєму напрямку\n• Стрілка вилетить, лише якщо на її шляху нічого немає\n• Прибери всі стрілки з поля, щоб пройти рівень\n• Уникай помилок — на кожен рівень у тебе лише 3 серця\n• Отримай до 3 зірок за ідеальне проходження\n\n🧠 500 РІВНІВ, СТВОРЕНИХ ВРУЧНУ\nПочни з легких розминок і дійди до великих і хитрих полів. Кожен рівень — нова головоломка, що тренує логіку, увагу та вміння планувати.\n\n💡 РОЗУМНІ ПІДКАЗКИ\nЗастряг у хитрій пастці? Скористайся підказкою (Hint), щоб побачити наступну безпечну стрілку, або увімкни сітку (Grid), щоб чітко бачити кожен шлях.\n\n🔥 ЩОДЕННІ ВИКЛИКИ\nНова головоломка щодня! Проходь щоденний виклик, стеж за прогресом у календарі та збільшуй свою серію перемог.\n\n💎 СКАРБНИЦЯ КРИСТАЛІВ І БЕЗКОШТОВНІ НАГОРОДИ\n• Забирай безкоштовний щоденний подарунок\n• Виконуй щоденні завдання та досягнення, щоб отримати бонусні кристали\n• Витрачай кристали на підказки, сітку та додаткові життя\n\n⭐ ЗІРКИ Й ДОСЯГНЕННЯ\nЗбирай зірки на кожному рівні, подвоюй їх бонусом і відкривай нагороди за досягнення в міру проходження.\n\n✨ ЧОМУ ТОБІ СПОДОБАЄТЬСЯ ARROW PUZZLE\n• Чистий сучасний темний дизайн, комфортний для очей\n• Плавні й приємні анімації стрілок\n• Без таймера — грай у своєму темпі\n• Короткі рівні — чудово на кілька вільних хвилин\n• Безкоштовна гра\n\nЯкщо тобі подобаються логічні ігри, головоломки, задачі на кмітливість, ігри-лабіринти чи ігри, де треба прибирати фігури з поля, Arrow Puzzle стане твоєю новою улюбленою грою.\n\nЗавантажуй зараз і дізнайся, скільки стрілок ти зможеш випустити!"}, {"language": "Malay – ms", "label": "Malay", "code": "ms", "name": "Arrow Puzzle: Permainan Minda", "short": "Ketik anak panah & kosongkan papan! 500 teka-teki logik dan cabaran harian", "full": "Bolehkah anda mencari jalan keluar? Ketik anak panah mengikut susunan yang betul dan kosongkan seluruh papan!\n\nArrow Puzzle ialah permainan teka-teki logik yang ringkas tetapi mengasyikkan. Setiap anak panah meluncur ke arah yang ditunjuknya – tetapi hanya jika laluannya kosong. Pilih yang salah, ia akan tersekat. Fikir ke hadapan, rancang langkah anda dan bebaskan setiap anak panah untuk menang.\n\nMudah dipelajari, sukar dikuasai – permainan minda yang sempurna untuk rehat sebentar atau sesi santai yang panjang.\n\n🏹 CARA BERMAIN\n• Ketik anak panah untuk melancarkannya ke arahnya\n• Anak panah hanya boleh keluar jika tiada apa-apa yang menghalang laluannya\n• Kosongkan semua anak panah dari papan untuk melengkapkan tahap\n• Elakkan kesilapan – anda hanya ada 3 hati bagi setiap tahap\n• Dapatkan sehingga 3 bintang untuk permainan sempurna\n\n🧠 500 TAHAP YANG DIREKA KHAS\nMulakan dengan tahap memanaskan badan yang santai dan teruskan hingga ke papan besar yang mencabar. Setiap tahap ialah teka-teki baharu yang melatih logik, tumpuan dan kemahiran merancang anda.\n\n💡 BANTUAN PINTAR\nTersekat dalam perangkap yang sukar? Gunakan Petunjuk (Hint) untuk melihat anak panah selamat seterusnya, atau hidupkan Grid untuk melihat setiap laluan dengan jelas.\n\n🔥 CABARAN HARIAN\nTeka-teki baharu setiap hari! Mainkan Cabaran Harian, jejaki kemajuan anda di kalendar dan panjangkan rentetan kemenangan anda.\n\n💎 PERBENDAHARAAN PERMATA & GANJARAN PERCUMA\n• Tuntut hadiah harian percuma\n• Lengkapkan tugasan harian dan pencapaian untuk permata bonus\n• Gunakan permata untuk petunjuk, grid dan nyawa tambahan\n\n⭐ BINTANG & PENCAPAIAN\nKumpul bintang di setiap tahap, gandakan dengan bonus dan buka ganjaran pencapaian sepanjang perjalanan anda.\n\n✨ KENAPA ANDA AKAN SUKA ARROW PUZZLE\n• Reka bentuk gelap yang kemas dan moden, selesa untuk mata\n• Animasi anak panah yang lancar dan memuaskan\n• Tiada pemasa – main mengikut rentak anda\n• Tahap yang pendek, sesuai untuk beberapa minit masa lapang\n• Percuma untuk dimainkan\n\nJika anda suka permainan logik, teka-teki, asah minda, puzzle unblock atau permainan labirin, Arrow Puzzle akan menjadi kegemaran baharu anda.\n\nMuat turun sekarang dan lihat berapa banyak anak panah yang boleh anda bebaskan!"}];

const FIELDS = [
  { key: 'language', title: 'LANGUAGE', max: null, big: true },
  { key: 'name', title: 'APP NAME', max: 30, big: true },
  { key: 'short', title: 'SHORT DESCRIPTION', max: 80 },
  { key: 'full', title: 'FULL DESCRIPTION', max: 4000 },
];

const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

// Play counts characters (code points), not bytes.
const charCount = s => Array.from(s.normalize('NFC')).length;

const nav = document.getElementById('nav');
const content = document.getElementById('content');
document.getElementById('langCount').textContent = LANGS.length;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

LANGS.forEach((l, i) => {
  const b = el('button');
  b.dataset.i = i;
  b.append(el('span', 'num', String(i + 1).padStart(2, '0')), el('span', 'lbl', l.label), el('span', 'code', l.code));
  b.addEventListener('click', () => select(i));
  nav.append(b);
});

function select(i) {
  const l = LANGS[i];
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', +b.dataset.i === i));
  const activeBtn = nav.querySelector('button.active');
  if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest', inline: 'center' });
  content.replaceChildren();
  FIELDS.forEach(f => {
    const text = l[f.key];
    const card = el('section', 'field');
    const head = el('div', 'field-head');
    const title = el('div', 'field-title', f.title + (f.max ? ' (max ' + f.max + ')' : ''));
    if (f.max) {
      const n = charCount(text);
      title.append(el('span', 'count' + (n > f.max ? ' over' : ''), n + ' / ' + f.max));
    }
    const btn = el('button', 'copy');
    btn.type = 'button';
    btn.innerHTML = COPY_ICON + '<span>Copy</span>';
    btn.setAttribute('aria-label', 'Copy ' + f.title.toLowerCase());
    btn.addEventListener('click', () => copy(text, btn));
    head.append(title, btn);
    const val = el('p', 'value' + (f.big ? ' big' : ''), text);
    val.dir = 'auto';
    card.append(head, val);
    content.append(card);
  });
  try { localStorage.setItem('apl-lang', l.code); } catch (e) {}
  if (history.replaceState) history.replaceState(null, '', '#' + l.code);
  document.querySelector('main').scrollTop = 0;
}

async function copy(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = el('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  const label = btn.querySelector('span');
  label.textContent = ok ? 'Copied!' : 'Copy failed';
  btn.classList.toggle('done', ok);
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { label.textContent = 'Copy'; btn.classList.remove('done'); }, 1500);
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  nav.querySelectorAll('button').forEach(b => {
    const l = LANGS[+b.dataset.i];
    b.hidden = q && !(l.label + ' ' + l.code).toLowerCase().includes(q);
  });
});

let start = 0;
let wanted = decodeURIComponent(location.hash.slice(1));
if (!wanted) { try { wanted = localStorage.getItem('apl-lang') || ''; } catch (e) {} }
const found = LANGS.findIndex(l => l.code === wanted);
if (found >= 0) start = found;
select(start);
</script>
